name: Unity Activation (one-off)

# 用法：手动跑一次 → 下载 artifact 里的 .alf
# → 上传到 https://license.unity3d.com/manual 换 .ulf
# → 把 .ulf 内容粘贴到 repo Secret `UNITY_LICENSE`
# Personal license 的 ULF 大约一年过期，到时重新跑这个 workflow。

on:
  workflow_dispatch:
    inputs:
      unityVersion:
        description: 'Unity version (must match a real release; ALF itself is account-bound, not strictly version-bound)'
        required: true
        default: '6000.0.32f1'

jobs:
  activation:
    name: Request manual activation file
    runs-on: ubuntu-latest
    steps:
      - name: Request activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: ${{ github.event.inputs.unityVersion }}

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v${{ github.event.inputs.unityVersion }}.alf
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
